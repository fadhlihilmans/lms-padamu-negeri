<span class="material-symbols-outlined">send</span>

<script>
        // Simple JS for radio selection visual update (demonstration purposes)
        document.querySelectorAll('input[type="radio"][name="answer"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Reset all labels
                document.querySelectorAll('input[type="radio"][name="answer"]').forEach(r => {
                    const label = r.closest('label');
                    label.classList.remove('bg-primary-fixed', 'border-primary', 'border-2');
                    label.classList.add('bg-surface-container-lowest', 'border-outline-variant');
                    const icon = label.querySelector('.material-symbols-outlined');
                    if(icon) icon.remove();
                    const textSpan = label.querySelector('span.text-primary');
                    if(textSpan) {
                         textSpan.classList.remove('text-primary');
                         textSpan.classList.add('text-secondary');
                    }
                });

                // Set active label
                if(e.target.checked) {
                    const label = e.target.closest('label');
                    label.classList.remove('bg-surface-container-lowest', 'border-outline-variant');
                    label.classList.add('bg-primary-fixed', 'border-primary', 'border-2');
                    
                    const textSpan = label.querySelector('span.text-secondary');
                    if(textSpan) {
                         textSpan.classList.remove('text-secondary');
                         textSpan.classList.add('text-primary');
                    }

                    if(!label.querySelector('.material-symbols-outlined')) {
                        const icon = document.createElement('span');
                        icon.className = 'material-symbols-outlined text-primary absolute right-6 top-1/2 -translate-y-1/2';
                        icon.textContent = 'check_circle';
                        label.appendChild(icon);
                    }
                }
            });
        });
    </script>
