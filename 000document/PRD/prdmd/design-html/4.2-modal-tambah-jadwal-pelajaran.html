<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Tambah Jadwal — LMS Padamu Negeri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; }
  </style>
</head>
<!--
  File ini hanya menampilkan MODAL tambah/edit jadwal (backdrop = 4.1 yang diblur).

  Ukuran modal: sm:max-w-lg
  Alasan: 5 field (Rombel, Mapel, Guru, Hari, Jam ke-)
  Jam ke- menggunakan double select (dari–sampai).

  Modal ini dipakai untuk Tambah dan Edit — bedanya hanya judul & tombol submit.
-->
<body class="min-h-screen overflow-hidden" style="background:#F1F5F9;">

<!-- Blurred BG (simulasi 4.1) -->
<div class="fixed inset-0 z-0 overflow-hidden" style="filter:blur(3px) brightness(0.88);transform:scale(1.02)">
  <aside class="fixed left-0 top-0 h-full bg-white border-r flex flex-col" style="width:256px;border-color:#c5c5d7">
    <div class="px-5 py-4 border-b flex items-center gap-3" style="border-color:#c5c5d7">
      <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#3c50e0"><span class="material-symbols-outlined text-white text-[18px]" style="font-variation-settings:'FILL' 1">school</span></div>
      <div><div class="text-[13.5px] font-bold" style="color:#3c50e0">LMS Padamu Negeri</div><div class="text-[11px]" style="color:#757686">Sistem Akademik PKBM</div></div>
    </div>
    <nav class="flex-1 px-3 pt-2 space-y-0.5">
      <div class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13.5px]" style="color:#505f76"><span class="material-symbols-outlined text-[18px]">dashboard</span>Dashboard</div>
      <div class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13.5px] font-semibold" style="color:#3c50e0;background:rgba(60,80,224,0.08);border-left:3px solid #3c50e0;padding-left:calc(12px - 3px)"><span class="material-symbols-outlined text-[18px]">schedule</span>Jadwal Pelajaran</div>
      <div class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13.5px]" style="color:#505f76"><span class="material-symbols-outlined text-[18px]">how_to_reg</span>Absensi</div>
    </nav>
  </aside>
  <header class="fixed top-0 right-0 bg-white border-b flex items-center justify-between px-5" style="left:256px;height:56px;border-color:#c5c5d7">
    <span class="text-[15px] font-semibold" style="color:#171c1f">Jadwal Pelajaran</span>
    <div class="w-8 h-8 rounded-full" style="background:#3c50e0"></div>
  </header>
  <main style="margin-left:256px;margin-top:56px;padding:20px">
    <div class="flex items-center justify-between mb-4">
      <div><div class="h-6 w-40 rounded" style="background:#e2e8f0"></div><div class="h-3 w-60 rounded mt-2" style="background:#f0f4f8"></div></div>
      <div class="h-9 w-32 rounded-lg" style="background:#3c50e0"></div>
    </div>
    <div class="bg-white rounded-xl border overflow-hidden" style="border-color:#c5c5d7">
      <div class="h-12 border-b" style="border-color:#c5c5d7;background:#f6fafe"></div>
      <div class="h-48"></div>
    </div>
  </main>
</div>

<!-- MODAL — Tambah Jadwal -->
<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style="background:rgba(0,0,0,0.5);backdrop-filter:blur(1px)">
  <div class="relative z-10 w-full sm:max-w-lg bg-white rounded-t-2xl sm:rounded-xl shadow-xl flex flex-col max-h-[92dvh] sm:max-h-[88vh]">

    <div class="flex items-center justify-between px-5 py-4 border-b flex-shrink-0" style="border-color:#c5c5d7">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:#EEF2FF">
          <span class="material-symbols-outlined text-[18px]" style="color:#3c50e0">schedule</span>
        </div>
        <h3 class="text-[15px] font-semibold" style="color:#171c1f">Tambah Jadwal</h3>
      </div>
      <button class="w-8 h-8 flex items-center justify-center rounded-lg cursor-pointer" style="color:#757686" onmouseover="this.style.background='#f0f4f8'" onmouseout="this.style.background='transparent'">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>

    <div class="px-5 py-5 space-y-4 overflow-y-auto flex-1">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-[13px] font-medium mb-1.5" style="color:#171c1f">Rombel <span style="color:#ba1a1a">*</span></label>
          <select class="w-full px-3 py-2.5 rounded-lg text-[13.5px] outline-none cursor-pointer" style="border:1.5px solid #c5c5d7;color:#171c1f;background:white" onfocus="this.style.borderColor='#3c50e0';this.style.boxShadow='0 0 0 3px rgba(60,80,224,0.1)'" onblur="this.style.borderColor='#c5c5d7';this.style.boxShadow='none'">
            <option value="" disabled selected>Pilih rombel...</option>
            <option>Rombel A</option><option>Rombel B</option><option>Rombel Mandiri 1</option>
          </select>
        </div>
        <div>
          <label class="block text-[13px] font-medium mb-1.5" style="color:#171c1f">Mata Pelajaran <span style="color:#ba1a1a">*</span></label>
          <select class="w-full px-3 py-2.5 rounded-lg text-[13.5px] outline-none cursor-pointer" style="border:1.5px solid #c5c5d7;color:#171c1f;background:white" onfocus="this.style.borderColor='#3c50e0';this.style.boxShadow='0 0 0 3px rgba(60,80,224,0.1)'" onblur="this.style.borderColor='#c5c5d7';this.style.boxShadow='none'">
            <option value="" disabled selected>Pilih mapel...</option>
            <option>Matematika</option><option>Bahasa Indonesia</option><option>IPA Terpadu</option><option>IPS</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-[13px] font-medium mb-1.5" style="color:#171c1f">Guru Pengampu <span style="color:#ba1a1a">*</span></label>
        <select class="w-full px-3 py-2.5 rounded-lg text-[13.5px] outline-none cursor-pointer" style="border:1.5px solid #c5c5d7;color:#171c1f;background:white" onfocus="this.style.borderColor='#3c50e0';this.style.boxShadow='0 0 0 3px rgba(60,80,224,0.1)'" onblur="this.style.borderColor='#c5c5d7';this.style.boxShadow='none'">
          <option value="" disabled selected>Pilih guru...</option>
          <option>Ahmad Suryanto, S.Pd</option><option>Sari Rahayu, S.Pd</option><option>Budi Santoso, S.Pd</option>
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-[13px] font-medium mb-1.5" style="color:#171c1f">Hari <span style="color:#ba1a1a">*</span></label>
          <select class="w-full px-3 py-2.5 rounded-lg text-[13.5px] outline-none cursor-pointer" style="border:1.5px solid #c5c5d7;color:#171c1f;background:white" onfocus="this.style.borderColor='#3c50e0';this.style.boxShadow='0 0 0 3px rgba(60,80,224,0.1)'" onblur="this.style.borderColor='#c5c5d7';this.style.boxShadow='none'">
            <option value="" disabled selected>Pilih hari...</option>
            <option>Senin</option><option>Selasa</option><option>Rabu</option>
            <option>Kamis</option><option>Jumat</option><option>Sabtu</option>
          </select>
        </div>
        <div>
          <label class="block text-[13px] font-medium mb-1.5" style="color:#171c1f">Jam Ke- <span style="color:#ba1a1a">*</span></label>
          <div class="flex items-center gap-2">
            <select class="flex-1 px-3 py-2.5 rounded-lg text-[13.5px] outline-none cursor-pointer" style="border:1.5px solid #c5c5d7;color:#171c1f;background:white" onfocus="this.style.borderColor='#3c50e0';this.style.boxShadow='0 0 0 3px rgba(60,80,224,0.1)'" onblur="this.style.borderColor='#c5c5d7';this.style.boxShadow='none'">
              <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
            </select>
            <span class="text-[12px] flex-shrink-0" style="color:#757686">s/d</span>
            <select class="flex-1 px-3 py-2.5 rounded-lg text-[13.5px] outline-none cursor-pointer" style="border:1.5px solid #c5c5d7;color:#171c1f;background:white" onfocus="this.style.borderColor='#3c50e0';this.style.boxShadow='0 0 0 3px rgba(60,80,224,0.1)'" onblur="this.style.borderColor='#c5c5d7';this.style.boxShadow='none'">
              <option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
            </select>
          </div>
          <p class="text-[11.5px] mt-1" style="color:#9da4b0">Isi sama jika hanya 1 jam.</p>
        </div>
      </div>

      <!-- Peringatan bentrok jadwal — muncul saat validasi menemukan konflik -->
      <div class="flex items-start gap-2.5 p-3.5 rounded-lg border" style="background:#fff7ed;border-color:#fdba74">
        <span class="material-symbols-outlined text-[17px] flex-shrink-0 mt-0.5" style="color:#ea580c;font-variation-settings:'FILL' 1">warning</span>
        <p class="text-[12.5px] leading-relaxed" style="color:#9a3412">Jam ke-1–2 Senin di Rombel A sudah dipakai oleh <strong>Matematika</strong>. Silakan pilih jam lain. <em>(Contoh state konflik)</em></p>
      </div>
    </div>

    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 px-5 py-4 border-t flex-shrink-0" style="border-color:#c5c5d7;background:#f6fafe">
      <button class="px-4 py-2.5 rounded-lg text-[13px] font-medium border cursor-pointer" style="color:#505f76;border-color:#c5c5d7;background:white" onmouseover="this.style.background='#f0f4f8'" onmouseout="this.style.background='white'">Batal</button>
      <button class="px-5 py-2.5 rounded-lg text-[13.5px] font-semibold text-white cursor-pointer flex items-center gap-2" style="background:#3c50e0" onmouseover="this.style.background='#2e3eb0'" onmouseout="this.style.background='#3c50e0'">
        <span class="material-symbols-outlined text-[16px]">save</span>Simpan Jadwal
      </button>
    </div>
  </div>
</div>

</body>
</html>
