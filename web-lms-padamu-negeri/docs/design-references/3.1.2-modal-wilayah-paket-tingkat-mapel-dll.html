<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3.1.2 — Modal Master Data | LMS Padamu Negeri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; }
  </style>
</head>
<!--
  File ini hanya menampilkan MODAL (bukan halaman penuh).
  Backdrop berupa screenshot halaman 3.1.1 yang diblur.

  Ukuran modal: sm:max-w-sm
  Alasan: hanya 1 field input (nama saja).
  Tambahkan 1 field paket/tingkat jika diperlukan → naik ke sm:max-w-md.
-->
<body class="min-h-screen overflow-hidden" style="background:#F1F5F9;">

<!-- Blurred BG -->
<div class="fixed inset-0 z-0 overflow-hidden" style="filter:blur(3px) brightness(0.88);transform:scale(1.02)">
  <aside class="fixed left-0 top-0 h-full bg-white border-r flex flex-col" style="width:256px;border-color:#c5c5d7">
    <div class="px-5 py-4 border-b flex items-center gap-3" style="border-color:#c5c5d7">
      <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#3c50e0"><span class="material-symbols-outlined text-white text-[18px]" style="font-variation-settings:'FILL' 1">school</span></div>
      <div><div class="text-[13.5px] font-bold" style="color:#3c50e0">LMS Padamu Negeri</div><div class="text-[11px]" style="color:#757686">Sistem Akademik PKBM</div></div>
    </div>
    <nav class="flex-1 px-3 pt-2 space-y-0.5">
      <div class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13.5px]" style="color:#505f76"><span class="material-symbols-outlined text-[18px]">dashboard</span>Dashboard</div>
      <div class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13.5px] font-semibold" style="color:#3c50e0;background:rgba(60,80,224,0.08);border-left:3px solid #3c50e0;padding-left:calc(12px - 3px)"><span class="material-symbols-outlined text-[18px]">storage</span>Master Data</div>
      <div class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13.5px]" style="color:#505f76"><span class="material-symbols-outlined text-[18px]">group_work</span>Rombel</div>
    </nav>
  </aside>
  <header class="fixed top-0 right-0 bg-white border-b flex items-center justify-between px-5" style="left:256px;height:56px;border-color:#c5c5d7">
    <span class="text-[15px] font-semibold" style="color:#171c1f">Master Data</span>
    <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full" style="background:#3c50e0"></div></div>
  </header>
  <main style="margin-left:256px;margin-top:56px;padding:20px">
    <!-- Toolbar placeholder -->
    <div class="flex gap-3 mb-4"><div class="h-9 rounded-lg flex-1" style="background:white;border:1.5px solid #c5c5d7"></div><div class="h-9 w-24 rounded-lg" style="background:#3c50e0"></div></div>
    <!-- Tab header -->
    <div class="bg-white rounded-xl border overflow-hidden" style="border-color:#c5c5d7">
      <div class="flex border-b px-1" style="border-color:#c5c5d7">
        <div class="px-4 py-2.5 text-[13px] font-semibold border-b-2" style="color:#3c50e0;border-color:#3c50e0">Wilayah</div>
        <div class="px-4 py-2.5 text-[13px]" style="color:#757686">Paket</div>
        <div class="px-4 py-2.5 text-[13px]" style="color:#757686">Tingkat</div>
        <div class="px-4 py-2.5 text-[13px]" style="color:#757686">Mata Pelajaran</div>
      </div>
      <div style="height:180px;background:#f6fafe"></div>
    </div>
  </main>
</div>

<!-- OVERLAY + MODAL -->
<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style="background:rgba(0,0,0,0.5);backdrop-filter:blur(1px)">
  <div class="relative z-10 w-full sm:max-w-sm bg-white rounded-t-2xl sm:rounded-xl overflow-hidden shadow-xl flex flex-col max-h-[80dvh] sm:max-h-[70vh]" style="box-shadow:0 20px 60px -10px rgba(0,0,0,0.25)">

    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b flex-shrink-0" style="border-color:#c5c5d7">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:#EEF2FF">
          <span class="material-symbols-outlined text-[18px]" style="color:#3c50e0">location_on</span>
        </div>
        <div>
          <h3 class="text-[15px] font-semibold" style="color:#171c1f">Tambah Wilayah</h3>
        </div>
      </div>
      <button class="w-8 h-8 flex items-center justify-center rounded-lg cursor-pointer" style="color:#757686" onmouseover="this.style.background='#f0f4f8'" onmouseout="this.style.background='transparent'">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="px-5 py-5 overflow-y-auto flex-1">
      <label class="block text-[13px] font-medium mb-1.5" style="color:#171c1f">Nama Wilayah <span style="color:#ba1a1a">*</span></label>
      <input type="text" value="Botolambat" class="w-full px-3 py-2.5 rounded-lg text-[14px] bg-white outline-none"
             style="border:1.5px solid #3c50e0;box-shadow:0 0 0 3px rgba(60,80,224,0.1);color:#171c1f"
             placeholder="Contoh: Wilayah Timur">
      <p class="text-[12px] mt-1.5" style="color:#9da4b0">Nama wilayah harus unik dan tidak boleh duplikat.</p>
    </div>

    <!-- Footer -->
    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 px-5 py-4 border-t flex-shrink-0" style="border-color:#d1d5db;background:white">
      <button class="px-4 py-2.5 rounded-lg text-[13px] font-medium border cursor-pointer" style="color:#505f76;border-color:#c5c5d7;background:white" onmouseover="this.style.background='#f0f4f8'" onmouseout="this.style.background='white'">Batal</button>
      <button class="px-5 py-2.5 rounded-lg text-[13.5px] font-semibold text-white cursor-pointer" style="background:#3c50e0" onmouseover="this.style.background='#2e3eb0'" onmouseout="this.style.background='#3c50e0'">Simpan</button>
    </div>
  </div>
</div>

<!-- ────────────────────────────────────────────
     VARIAN: Modal Edit Mapel (lebih banyak field)
     Ukuran naik ke sm:max-w-md karena 3 field.
     ────────────────────────────────────────────
     Uncomment blok ini untuk preview varian Edit Mapel

  <div class="relative z-10 w-full sm:max-w-md bg-white rounded-t-2xl sm:rounded-xl overflow-hidden shadow-xl flex flex-col max-h-[85dvh] sm:max-h-[80vh]">
    <div class="flex items-center justify-between px-5 py-4 border-b" style="border-color:#c5c5d7">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:#EEF2FF"><span class="material-symbols-outlined text-[18px]" style="color:#3c50e0">menu_book</span></div>
        <h3 class="text-[15px] font-semibold" style="color:#171c1f">Edit Mata Pelajaran</h3>
      </div>
      <button class="w-8 h-8 flex items-center justify-center rounded-lg cursor-pointer" style="color:#757686"><span class="material-symbols-outlined text-[18px]">close</span></button>
    </div>
    <div class="px-5 py-5 space-y-4 overflow-y-auto flex-1">
      <div>
        <label class="block text-[13px] font-medium mb-1.5" style="color:#171c1f">Nama Mata Pelajaran *</label>
        <input type="text" value="Matematika" class="w-full px-3 py-2.5 rounded-lg text-[14px]" style="border:1.5px solid #3c50e0;box-shadow:0 0 0 3px rgba(60,80,224,0.1);color:#171c1f">
      </div>
      <div>
        <label class="block text-[13px] font-medium mb-1.5" style="color:#171c1f">Paket *</label>
        <select class="w-full px-3 py-2.5 rounded-lg text-[14px] outline-none" style="border:1.5px solid #c5c5d7;color:#171c1f">
          <option>Paket C</option><option>Paket A</option><option>Paket B</option>
        </select>
      </div>
      <div>
        <label class="block text-[13px] font-medium mb-1.5" style="color:#171c1f">Tingkat *</label>
        <select class="w-full px-3 py-2.5 rounded-lg text-[14px] outline-none" style="border:1.5px solid #c5c5d7;color:#171c1f">
          <option>Tingkat 3</option><option>Tingkat 1</option><option>Tingkat 2</option>
        </select>
      </div>
    </div>
    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 px-5 py-4 border-t" style="border-color:#c5c5d7;background:#f6fafe">
      <button class="px-4 py-2.5 rounded-lg text-[13px] font-medium border" style="color:#505f76;border-color:#c5c5d7;background:white">Batal</button>
      <button class="px-5 py-2.5 rounded-lg text-[13.5px] font-semibold text-white" style="background:#3c50e0">Simpan Perubahan</button>
    </div>
  </div>
</div>
-->

</body>
</html>
