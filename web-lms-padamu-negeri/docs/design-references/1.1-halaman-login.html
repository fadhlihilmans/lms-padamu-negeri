<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1.1 — Halaman Login | LMS Padamu Negeri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    html, body { overflow: hidden; }
  </style>
</head>

<body class="h-screen flex items-center justify-center p-4 relative bg-white">

  <!-- Background decoration circles (subtle, on white) -->
  <div class="absolute top-[-80px] right-[-80px] w-72 h-72 rounded-full pointer-events-none"
       style="background: rgba(60,80,224,0.05)"></div>
  <div class="absolute bottom-[-60px] left-[-60px] w-56 h-56 rounded-full pointer-events-none"
       style="background: rgba(60,80,224,0.04)"></div>

  <!-- Card -->
  <div class="relative w-full max-w-[360px] bg-white rounded-2xl overflow-hidden"
       style="box-shadow: 0 8px 32px -4px rgba(0,0,0,0.10), 0 0 0 1px #d1d5db">

    <!-- Card Header / Brand -->
    <div class="px-8 pt-8 pb-6 text-center">
      <div class="w-16 h-16 rounded-2xl mx-auto mb-4 flex items-center justify-center"
           style="background: #EEF2FF">
        <span class="material-symbols-outlined text-[30px]"
              style="color:#3c50e0;font-variation-settings:'FILL' 1, 'wght' 400">school</span>
      </div>
      <h1 class="text-[20px] font-bold leading-tight tracking-tight" style="color:#171c1f">LMS Padamu Negeri</h1>
      <p class="text-[13px] mt-1" style="color:#757686">Sistem Akademik PKBM</p>
    </div>

    <!-- Form Body -->
    <div class="px-6 py-6">
      <form action="#" method="POST" class="space-y-4">

        <!-- Username -->
        <div>
          <label for="username" class="block text-[13px] font-medium mb-1.5" style="color: #171c1f">
            Username
            <span class="font-normal" style="color: #757686">(NIP / NIPD)</span>
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none text-[18px]"
                  style="color: #9da4b0">person</span>
            <input
              id="username" name="username" type="text"
              placeholder="Masukkan username" required
              class="w-full pl-9 pr-4 py-2.5 rounded-lg text-[14px] bg-white outline-none transition-all"
              style="border: 1.5px solid #c5c5d7; color: #171c1f;"
              onfocus="this.style.borderColor='#3c50e0'; this.style.boxShadow='0 0 0 3px rgba(60,80,224,0.12)'"
              onblur="this.style.borderColor='#c5c5d7'; this.style.boxShadow='none'"
            >
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-[13px] font-medium mb-1.5" style="color: #171c1f">
            Password
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none text-[18px]"
                  style="color: #9da4b0">lock</span>
            <input
              id="password" name="password" type="password"
              placeholder="Masukkan password" required
              class="w-full pl-9 pr-10 py-2.5 rounded-lg text-[14px] bg-white outline-none transition-all"
              style="border: 1.5px solid #c5c5d7; color: #171c1f;"
              onfocus="this.style.borderColor='#3c50e0'; this.style.boxShadow='0 0 0 3px rgba(60,80,224,0.12)'"
              onblur="this.style.borderColor='#c5c5d7'; this.style.boxShadow='none'"
            >
            <button type="button" onclick="togglePassword()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center justify-center w-6 h-6 cursor-pointer transition-colors"
                    style="color: #9da4b0"
                    onmouseover="this.style.color='#505f76'" onmouseout="this.style.color='#9da4b0'">
              <span class="material-symbols-outlined text-[18px]" id="toggle-icon">visibility</span>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <div class="pt-2">
          <button type="submit"
                  class="w-full py-2.5 rounded-lg text-[14px] font-semibold text-white cursor-pointer transition-all"
                  style="background: #3c50e0; box-shadow: 0 2px 8px rgba(60,80,224,0.35)"
                  onmouseover="this.style.background='#2e3eb0'"
                  onmouseout="this.style.background='#3c50e0'">
            Masuk
          </button>
        </div>

      </form>

      <!-- Helper -->
      <p class="text-center text-[13px] mt-5" style="color: #757686">
        Lupa password?
        <a href="#" class="font-medium cursor-pointer" style="color: #3c50e0"
           onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
          Hubungi Admin
        </a>
      </p>
    </div>

  </div>

  <!-- Footer note -->
  <p class="absolute bottom-4 left-0 right-0 text-center text-[11px]" style="color: #b0b0c0">
    © <span id="yr"></span> LMS Padamu Negeri — Semua hak dilindungi
  </p>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    function togglePassword() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('toggle-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }
  </script>
</body>
</html>
