<body class="min-h-screen flex items-center justify-center font-body-md text-on-surface">
<div class="w-full max-w-[400px] px-4 mx-auto">
<!-- Card -->
<div class="bg-surface-container-lowest rounded-lg border border-[#E2E8F0] shadow-sm p-card-padding">
<!-- Header -->
<div class="text-center mb-stack-lg">
<img alt="School Logo" class="w-16 h-16 mx-auto mb-4 object-cover rounded-full bg-surface-container" data-alt="A clean, modern logo placeholder suitable for an academic institution. A minimalist crest or open book icon in primary blue on a stark white background, conveying a sense of corporate modern professionalism and organized control." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtQi16pm8x0NsJU6cRs9U7cUMI35oDKHdi7A40zZWrFhabBhYpVfjToaRyOB4-ZW99S5aFEj6xck6XHJcGm9BhV53U325gc_YTQmDis33lAIIc13_u54JtgGPDCE8ei9xtyeNZJc4Q7o4NMy2ADI8-JureJB-9GfaQrbXfkicDzpDovsu97t55GGrcblQBQasjBVDoc5kw-gc_dIFK-m52N1-OPdFVdQLDS6EiVLFjumx2n9fEj3TrkPwj5MyolzaMm_V_APGW3o-K">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-1">LMS Padamu Negeri</h1>
<p class="font-body-md text-body-md text-secondary">Sistem Akademik PKBM</p>
</div>
<!-- Form -->
<form action="#" class="space-y-stack-md" method="POST">
<!-- Username Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="username">Username (NIP / NIPD)</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-[#E2E8F0] rounded-lg px-4 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-shadow duration-200" id="username" name="username" placeholder="Masukkan Username" required="" type="text">
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-[#E2E8F0] rounded-lg pl-4 pr-10 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-shadow duration-200" id="password" name="password" placeholder="Masukkan Password" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-secondary hover:text-on-surface focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibility-icon" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-2.5 rounded-lg hover:bg-primary transition-colors duration-200 mt-stack-lg shadow-sm" type="submit">
                    Masuk
                </button>
</form>
</div>
<!-- Helper Text -->
<div class="text-center mt-stack-md">
<p class="font-body-md text-body-md text-secondary">
                Lupa password? <a class="text-primary-container hover:text-primary hover:underline font-label-md" href="#">Hubungi Admin</a>
</p>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
                visibilityIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
                visibilityIcon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>


</body></html>
